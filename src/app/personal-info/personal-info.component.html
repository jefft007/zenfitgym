<div class="min-h-screen bg-gray-100 flex flex-col md:flex-row">
  <!-- Left Side - Progress Steps -->
  <div
    class="w-full md:w-1/2 bg-black relative overflow-hidden px-8 py-12 text-white flex flex-col items-start justify-start">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
      <img src="assets/images/b2.png" alt="Background" class="w-full h-full object-cover opacity-20" />
    </div>

    <!-- Logo -->
    <div class="mb-8 z-10">
      <img src="assets/images/logo.png" alt="ZenFit Logo" class="w-24 sm:w-28 md:w-32 h-auto" />
    </div>

    <!-- Stepper with Vertical Line -->
    <div class="relative mt-8 sm:mt-10 w-full max-w-xs z-10">
      <!-- Vertical Line -->
      <div class="absolute left-6 top-6 bottom-6 w-1 bg-white/30 hidden sm:block"></div>

      <div class="space-y-8 sm:space-y-10 ml-2 sm:ml-4">
        <!-- Step 1 - Name -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div
            class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/name.png" alt="Step 1 Icon"
              class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Name</span>
        </div>

        <!-- Step 2 - Password (Active) -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div
            class="w-12 h-12 rounded-full bg-lime-400 border-2 border-lime-400 flex items-center justify-center transition">
            <img src="assets/images/password.png" alt="Step 2 Icon"
              class="w-7 h-7 object-contain brightness-0 invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Password</span>
        </div>

        <!-- Step 3 - Personal Data -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div
            class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/person.png" alt="Step 3 Icon"
              class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Personal Data</span>
        </div>

        <!-- Step 4 - Confirm -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div
            class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/confirm.png" alt="Step 4 Icon"
              class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Confirm</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side - Password Form -->
  <div class="w-full md:w-1/2 bg-white flex flex-col justify-center px-8 sm:px-16 py-12">
    <div class="max-w-md mx-auto w-full">
      <!-- Header -->
      <div class="mb-8">
        <div class="flex items-center mb-4">
          <div class="w-12 h-12 bg-black rounded-full flex items-center justify-center mr-4">
            <img src="assets/images/pass2.png" alt="Lock" class="w-6 h-6">
          </div>
          <h1 class="text-4xl font-bold text-black">Password</h1>
        </div>
        <p class="text-gray-500 text-lg">Create your password for access</p>
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-medium mb-2">Password</label>
        <input type="password" [(ngModel)]="password" (input)="onPasswordChange()"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400 focus:border-transparent text-base"
          placeholder="Enter your password">
      </div>

      <!-- Strength Indicator -->
      <div class="mb-6">
        <div class="flex space-x-2 mb-2">
          <div class="flex-1 h-2 rounded-full" [ngClass]="getStrengthBarClass(0)"></div>
          <div class="flex-1 h-2 rounded-full" [ngClass]="getStrengthBarClass(1)"></div>
          <div class="flex-1 h-2 rounded-full" [ngClass]="getStrengthBarClass(2)"></div>
        </div>
        <div class="text-sm font-medium" [ngClass]="{
               'text-red-500': getPasswordStrengthText() === 'Weak',
               'text-yellow-500': getPasswordStrengthText() === 'Medium',
               'text-green-600': getPasswordStrengthText() === 'Strong'
             }">
          {{ getPasswordStrengthText() }} Password
        </div>
      </div>

      <!-- Requirements -->
      <div class="mb-8">
        <h3 class="text-gray-700 font-medium mb-4">How to create a secure password</h3>
        <ul class="space-y-2">
          <li class="flex items-start space-x-3">
            <span class="text-gray-400 text-sm mt-1">•</span>
            <span class="text-gray-600 text-sm">Use special characters and uppercase letters.</span>
          </li>
          <li class="flex items-start space-x-3">
            <span class="text-gray-400 text-sm mt-1">•</span>
            <span class="text-gray-600 text-sm">Avoid numeric sequences and your date of birth.</span>
          </li>
          <li class="flex items-start space-x-3">
            <span class="text-gray-400 text-sm mt-1">•</span>
            <span class="text-gray-600 text-sm">Use numbers.</span>
          </li>
        </ul>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between">
        <button type="button" (click)="goBack()"
          class="px-8 py-3 border border-gray-300 rounded-full text-gray-700 hover:bg-gray-50 transition-colors font-medium">
          Back
        </button>
        <button type="button" (click)="continue()" [disabled]="!isPasswordValid()"
          class="px-8 py-3 bg-black text-white rounded-full hover:bg-gray-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-medium">
          Continue
        </button>
      </div>
    </div>
  </div>
</div>
