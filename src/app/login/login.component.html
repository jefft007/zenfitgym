<div class="min-h-screen bg-gray-100 flex flex-col md:flex-row">
    <!-- Left Side - Visual -->
    <div
        class="w-full md:w-1/2 bg-black relative overflow-hidden px-8 py-12 text-white flex flex-col items-start justify-center">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img src="assets/images/b2.png" alt="Background" class="w-full h-full object-cover opacity-20" />
        </div>

        <!-- Logo -->
        <div class="mb-8 z-10">
            <img src="assets/images/logo.png" alt="ZenFit Logo" class="w-24 sm:w-28 md:w-32 h-auto" />
        </div>

        <div class="z-10 space-y-4 max-w-md">
            <h2 class="text-4xl font-bold text-white">Unlock Your Potential</h2>
            <p class="text-gray-400 text-lg">Login to access your personalized workout plans, track your progress, and
                join our elite community.</p>
        </div>
    </div>

    <!-- Right Panel with Form -->
    <div class="w-full md:w-1/2 bg-gray-50 flex flex-col justify-center items-center px-4 sm:px-8 lg:px-20 py-12">
        <!-- Logo Circle -->
        <div class="mb-8 sm:mb-10">
            <div
                class="w-20 h-20 sm:w-24 sm:h-24 bg-black rounded-full overflow-hidden flex items-center justify-center shadow-md">
                <img src="assets/images/logo2.png" alt="ZenFit Logo Circle" class="w-full h-full object-contain" />
            </div>
        </div>

        <!-- Welcome -->
        <div class="text-center mb-8 sm:mb-10">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
            <p class="text-gray-600">Enter your credentials to continue</p>
        </div>

        <!-- Form -->
        <form #form="ngForm" (ngSubmit)="onSubmit()" class="w-full max-w-md space-y-6">
            <!-- Email -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-1">E-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required email [(ngModel)]="credentials.email"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400 text-base"
                        placeholder="Enter your email" />
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required [(ngModel)]="credentials.password"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400 text-base"
                        placeholder="Enter your password" />
                </div>
            </div>

            <!-- Login Button -->
            <div>
                <button type="submit" [disabled]="!form.valid || isLoading"
                    class="w-full bg-black text-white py-3 px-6 rounded-full text-base font-semibold hover:bg-gray-800 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
                    <span *ngIf="!isLoading">Login</span>
                    <span *ngIf="isLoading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></span>
                </button>
            </div>

            <!-- Links -->
            <div class="flex justify-between text-sm">
                <a href="#" class="text-gray-500 hover:text-black transition">Forgot password?</a>
                <a routerLink="/registration" class="text-lime-600 font-semibold hover:underline">Create account</a>
            </div>
        </form>
    </div>
</div>
