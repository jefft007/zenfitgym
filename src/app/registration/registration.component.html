<div class="min-h-screen bg-gray-100 flex flex-col md:flex-row">
  <!-- Left Side - Progress Steps -->
  <div class="w-full md:w-1/2 bg-black relative overflow-hidden px-8 py-12 text-white flex flex-col items-start justify-start">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
      <img src="assets/images/b2.png" alt="Background" class="w-full h-full object-cover opacity-20" />
    </div>

    <!-- Logo -->
    <div class="mb-8 z-10">
      <img src="assets/images/logo.png" alt="ZenFit Logo" class="w-24 sm:w-28 md:w-32 h-auto" />
    </div>

    <!-- Stepper with Vertical Line -->
    <div class="relative mt-8 sm:mt-10 w-full max-w-xs z-10">
      <!-- Vertical Line -->
      <div class="absolute left-6 top-6 bottom-6 w-1 bg-white/30 hidden sm:block"></div>

      <div class="space-y-8 sm:space-y-10 ml-2 sm:ml-4">
        <!-- Step 1 - Name -->
        <div class="flex items-center space-x-4 relative z-10 group">
           <div class="w-12 h-12 rounded-full bg-lime-400 border-2 border-lime-400 flex items-center justify-center transition">
            <img src="assets/images/name.png" alt="Step 1 Icon" class="w-7 h-7 object-contain brightness-0 invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Name</span>
        </div>

        <!-- Step 2 - Password (Active) -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/password.png" alt="Step 2 Icon" class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Password</span>
        </div>

        <!-- Step 3 - Personal Data -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/person.png" alt="Step 3 Icon" class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Personal Data</span>
        </div>

        <!-- Step 4 - Confirm -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/confirm.png" alt="Step 4 Icon" class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Confirm</span>
        </div>
      </div>
    </div>
  </div>
  <!-- Right Panel with Form -->
  <div class="w-full md:w-1/2 bg-gray-50 flex flex-col justify-center items-center px-4 sm:px-8 lg:px-20 py-12">
    <!-- Logo Circle -->
    <div class="mb-8 sm:mb-10">
      <div class="w-20 h-20 sm:w-24 sm:h-24 bg-black rounded-full overflow-hidden flex items-center justify-center shadow-md">
        <img src="assets/images/logo2.png" alt="ZenFit Logo Circle" class="w-full h-full object-contain" />
      </div>
    </div>

    <!-- Welcome -->
    <div class="text-center mb-8 sm:mb-10">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">Welcome to ZenFit</h1>
      <p class="text-gray-600 text-base sm:text-lg">Train Your Body, Master Your Mind</p>
    </div>

    <!-- Form -->
    <form #form="ngForm" (ngSubmit)="onSubmit()" class="w-full max-w-md space-y-5 sm:space-y-6">
      <!-- Name -->
      <div>
        <label class="block text-gray-700 text-sm font-medium mb-1">Name</label>
        <input 
          type="text" 
          name="name" 
          required
          [(ngModel)]="formData.name"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400 text-base"
          placeholder="Enter your name"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-gray-700 text-sm font-medium mb-1">E-mail</label>
        <input 
          type="email" 
          name="email" 
          required
          email
          [(ngModel)]="formData.email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400 text-base"
          placeholder="Enter your email"
        />
      </div>

      <!-- Continue Button -->
      <div>
        <button 
          type="submit"
          [disabled]="!form.valid"
          class="w-full bg-black text-white py-3 px-6 rounded-full text-base font-semibold hover:bg-gray-800 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Continue
        </button>
      </div>
    </form>
  </div>
</div>
