<div class="min-h-screen bg-gray-100 flex flex-col md:flex-row">
    <!-- Left Side - Progress Steps -->
    <div
        class="w-full md:w-1/2 bg-black relative overflow-hidden px-8 py-12 text-white flex flex-col items-start justify-start">
        <div class="absolute inset-0 z-0">
            <img src="assets/images/b2.png" alt="Background" class="w-full h-full object-cover opacity-20" />
        </div>

        <div class="mb-8 z-10">
            <img src="assets/images/logo.png" alt="ZenFit Logo" class="w-24 sm:w-28 md:w-32 h-auto" />
        </div>

        <div class="relative mt-8 sm:mt-10 w-full max-w-xs z-10">
            <div class="absolute left-6 top-6 bottom-6 w-1 bg-white/30 hidden sm:block"></div>

            <div class="space-y-8 sm:space-y-10 ml-2 sm:ml-4">
                <div class="flex items-center space-x-4 relative z-10 group">
                    <div
                        class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
                        <img src="assets/images/name.png" alt="Step 1 Icon"
                            class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
                    </div>
                    <span class="text-white text-base sm:text-lg font-medium">Name</span>
                </div>

                <div class="flex items-center space-x-4 relative z-10 group">
                    <div
                        class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
                        <img src="assets/images/password.png" alt="Step 2 Icon"
                            class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
                    </div>
                    <span class="text-white text-base sm:text-lg font-medium">Password</span>
                </div>

                <div class="flex items-center space-x-4 relative z-10 group">
                    <div
                        class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
                        <img src="assets/images/person.png" alt="Step 3 Icon"
                            class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
                    </div>
                    <span class="text-white text-base sm:text-lg font-medium">Personal Data</span>
                </div>

                <!-- Step 4 - Confirm (Active) -->
                <div class="flex items-center space-x-4 relative z-10 group">
                    <div
                        class="w-12 h-12 rounded-full bg-lime-400 border-2 border-lime-400 flex items-center justify-center transition">
                        <img src="assets/images/confirm.png" alt="Step 4 Icon"
                            class="w-7 h-7 object-contain brightness-0 invert" />
                    </div>
                    <span class="text-white text-base sm:text-lg font-medium">Confirm</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Side - Confirm Summary -->
    <div class="w-full md:w-1/2 bg-white flex flex-col justify-center px-8 sm:px-16 py-12">
        <div class="max-w-md mx-auto w-full">
            <h1 class="text-3xl font-bold text-black mb-6">Confirm Details</h1>

            <div class="bg-gray-50 p-6 rounded-lg mb-6 shadow-sm border border-gray-100">
                <h3 class="font-bold text-lg mb-4 text-gray-800">Account Info</h3>
                <p class="mb-2"><span class="font-semibold text-gray-600">Name:</span> {{ userData.name }}</p>
                <p class="mb-2"><span class="font-semibold text-gray-600">Email:</span> {{ userData.email }}</p>

                <h3 class="font-bold text-lg mt-6 mb-4 text-gray-800">Personal Profile</h3>
                <p class="mb-2"><span class="font-semibold text-gray-600">Age:</span> {{ userData.age }}</p>
                <p class="mb-2"><span class="font-semibold text-gray-600">Gender:</span> {{ userData.gender }}</p>
                <p class="mb-2"><span class="font-semibold text-gray-600">Height:</span> {{ userData.height }} cm</p>
                <p class="mb-2"><span class="font-semibold text-gray-600">Weight:</span> {{ userData.weight }} kg</p>
                <p class="mb-2"><span class="font-semibold text-gray-600">Goal:</span> {{ userData.goal }}</p>
            </div>

            <div class="flex justify-between mt-8">
                <button (click)="goBack()"
                    class="px-8 py-3 border border-gray-300 rounded-full text-gray-700 hover:bg-gray-50 transition-colors font-medium">Back</button>
                <button (click)="onConfirm()" [disabled]="isLoading"
                    class="px-8 py-3 bg-black text-white rounded-full hover:bg-gray-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-medium flex items-center space-x-2">
                    <span *ngIf="isLoading">Processing...</span>
                    <span *ngIf="!isLoading">Register & Join</span>
                </button>
            </div>
        </div>
    </div>
</div>
