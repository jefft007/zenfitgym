<div class="min-h-screen bg-black text-white px-6 py-12">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row items-center sm:justify-between mb-12 gap-6">
        <div class="text-center sm:text-left">
            <img src="assets/images/logo.png" alt="ZenFit Logo" class="w-20 sm:w-24 mb-4 mx-auto sm:mx-0" />
            <h1 class="text-3xl sm:text-4xl font-bold">Elite Equipment</h1>
            <p class="text-lime-400 text-sm sm:text-base">The tools you need to build the body you want.</p>
        </div>
        <button (click)="goBack()"
            class="px-5 py-2 border border-lime-400 text-lime-400 rounded-full hover:bg-lime-400 hover:text-black transition text-sm">
            <i class="fas fa-arrow-left mr-2"></i> Back
        </button>
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let item of equipments"
            class="bg-gray-900 rounded-3xl overflow-hidden border border-gray-800 hover:border-lime-400 transition transform hover:-translate-y-2 group">
            <div class="h-64 overflow-hidden">
                <img [src]="item.img" [alt]="item.name"
                    class="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
            </div>
            <div class="p-6">
                <h3 class="text-2xl font-bold mb-2">{{ item.name }}</h3>
                <p class="text-gray-400">{{ item.desc }}</p>
                <button
                    class="mt-6 w-full py-3 bg-white/5 hover:bg-lime-400 hover:text-black rounded-2xl font-semibold transition">Learn
                    Usage</button>
            </div>
        </div>
    </div>
</div>
