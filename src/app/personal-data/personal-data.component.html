<div class="min-h-screen bg-gray-100 flex flex-col md:flex-row">
  <!-- Left Side - Progress Steps -->
  <div class="w-full md:w-1/2 bg-black relative overflow-hidden px-8 py-12 text-white flex flex-col items-start justify-start">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
      <img src="assets/images/b2.png" alt="Background" class="w-full h-full object-cover opacity-20" />
    </div>

    <!-- Logo -->
    <div class="mb-8 z-10">
      <img src="assets/images/logo.png" alt="ZenFit Logo" class="w-24 sm:w-28 md:w-32 h-auto" />
    </div>

    <!-- Stepper with Vertical Line -->
    <div class="relative mt-8 sm:mt-10 w-full max-w-xs z-10">
      <!-- Vertical Line -->
      <div class="absolute left-6 top-6 bottom-6 w-1 bg-white/30 hidden sm:block"></div>

      <div class="space-y-8 sm:space-y-10 ml-2 sm:ml-4">
        <!-- Step 1 - Name -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/name.png" alt="Step 1 Icon" class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Name</span>
        </div>

        <!-- Step 2 - Password -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/password.png" alt="Step 2 Icon" class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Password</span>
        </div>

        <!-- Step 3 - Personal Data (Active) -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div class="w-12 h-12 rounded-full bg-lime-400 border-2 border-lime-400 flex items-center justify-center transition">
            <img src="assets/images/person.png" alt="Step 3 Icon" class="w-7 h-7 object-contain brightness-0 invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Personal Data</span>
        </div>

        <!-- Step 4 - Confirm -->
        <div class="flex items-center space-x-4 relative z-10 group">
          <div class="w-12 h-12 rounded-full bg-white border-2 border-white flex items-center justify-center group-hover:bg-lime-400 group-hover:border-lime-400 transition">
            <img src="assets/images/confirm.png" alt="Step 4 Icon" class="w-7 h-7 object-contain group-hover:brightness-0 group-hover:invert" />
          </div>
          <span class="text-white text-base sm:text-lg font-medium">Confirm</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side - Personal Data Form -->
  <div class="w-full md:w-1/2 bg-white flex flex-col justify-center px-8 sm:px-16 py-12">
    <div class="max-w-md mx-auto w-full">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-black mb-2">Tell us about yourself</h1>
        <p class="text-gray-500">To create a personalized plan for you</p>
      </div>

      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-gray-700 font-medium mb-1">Age</label>
            <input type="number" name="age" [(ngModel)]="personalData.age" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400" placeholder="e.g. 25">
          </div>
          <div>
            <label class="block text-gray-700 font-medium mb-1">Gender</label>
            <select name="gender" [(ngModel)]="personalData.gender" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400">
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-gray-700 font-medium mb-1">Height (cm)</label>
            <input type="number" name="height" [(ngModel)]="personalData.height" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400" placeholder="e.g. 175">
          </div>
          <div>
            <label class="block text-gray-700 font-medium mb-1">Weight (kg)</label>
            <input type="number" name="weight" [(ngModel)]="personalData.weight" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400" placeholder="e.g. 70">
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-gray-700 font-medium mb-1">Goal</label>
          <select name="goal" [(ngModel)]="personalData.goal" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lime-400">
            <option>Weight Loss</option>
            <option>Muscle Gain</option>
            <option>Maintenance</option>
            <option>Flexibility</option>
          </select>
        </div>

        <div class="flex justify-between mt-8">
          <button type="button" (click)="goBack()" class="px-8 py-3 border border-gray-300 rounded-full text-gray-700 hover:bg-gray-50 transition-colors font-medium">Back</button>
          <button type="submit" [disabled]="!form.valid" class="px-8 py-3 bg-black text-white rounded-full hover:bg-gray-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-medium">Continue</button>
        </div>
      </form>
    </div>
  </div>
</div>
