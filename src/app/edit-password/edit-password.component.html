<div class="min-h-screen bg-black py-12 px-4 sm:px-6 lg:px-8 text-white flex items-center justify-center">
  <div class="max-w-md w-full">
    <div class="flex items-center gap-4 mb-8">
      <button (click)="goBack()"
        class="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center hover:bg-gray-800 transition">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1 class="text-3xl font-bold">Change Password</h1>
    </div>

    <div class="bg-gray-900 rounded-3xl p-8 border border-gray-800 shadow-2xl">
      <form #passForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Current Password -->
        <div>
          <label class="block text-gray-400 text-sm font-medium mb-2">Current Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
              <i class="fas fa-lock"></i>
            </span>
            <input type="password" name="currentPassword" [(ngModel)]="passwordData.currentPassword" required
              class="w-full bg-black border border-gray-800 rounded-2xl pl-12 pr-6 py-4 focus:border-lime-400 focus:outline-none transition"
              placeholder="••••••••" />
          </div>
        </div>

        <div class="h-[1px] bg-gray-800 my-4"></div>

        <!-- New Password -->
        <div>
          <label class="block text-gray-400 text-sm font-medium mb-2">New Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
              <i class="fas fa-key"></i>
            </span>
            <input type="password" name="newPassword" [(ngModel)]="passwordData.newPassword" required minlength="8"
              class="w-full bg-black border border-gray-800 rounded-2xl pl-12 pr-6 py-4 focus:border-lime-400 focus:outline-none transition"
              placeholder="••••••••" />
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-gray-400 text-sm font-medium mb-2">Confirm New Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
              <i class="fas fa-check-circle"></i>
            </span>
            <input type="password" name="confirmPassword" [(ngModel)]="passwordData.confirmPassword" required
              class="w-full bg-black border border-gray-800 rounded-2xl pl-12 pr-6 py-4 focus:border-lime-400 focus:outline-none transition"
              placeholder="••••••••" />
          </div>
        </div>

        <div class="pt-6">
          <button type="submit" [disabled]="!passForm.valid || isLoading"
            class="w-full bg-lime-400 text-black py-4 rounded-2xl font-bold hover:bg-lime-500 transition disabled:opacity-50 flex justify-center items-center">
            <span *ngIf="!isLoading">Update Password</span>
            <span *ngIf="isLoading" class="animate-spin rounded-full h-5 w-5 border-b-2 border-black"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
